# Strategie C : selection de la source de donnees par propriete externe.
#
# La valeur designe le NOM du bean DAO a utiliser (voir les @Component
# "dao", "dao2", "daoFile", "daoApi" du paquet dao).
#
#   dao      -> base de donnees de production    (100.0 -> 200.0)
#   dao2     -> base de donnees de developpement (150.0 -> 300.0)
#   daoFile  -> fichier local                    (180.0 -> 360.0)
#   daoApi   -> API REST externe                 (220.0 -> 440.0)
#
# Changer cette valeur suffit a changer de source : aucune recompilation,
# aucune modification du code Java.
dao.target=dao
